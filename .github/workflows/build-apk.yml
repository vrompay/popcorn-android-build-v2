name: Build Popcorn Time Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ARM Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3"

      - name: Use Java 8 for the old Gradle project
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Popcorn Time Android source
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --branch development --depth 1 https://github.com/popcorn-time-ru/popcorn-android.git source
          cd source
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Patch obsolete dependencies and repositories
        working-directory: source
        shell: bash
        run: |
          find . -type f -name '*.gradle' -print0 | \
            xargs -0 sed -i "/guardian\.github\.com\/maven\/repo-releases/d"

          find . -type f -name '*.gradle' -print0 | \
            xargs -0 sed -i "/com\.github\.ben-manes:gradle-versions-plugin:0\.17\.0/d"

          find . -type f -name '*.gradle' -print0 | \
            xargs -0 sed -i "/apply plugin: 'com\.github\.ben-manes\.versions'/d"

          sed -i \
            "s/com\.github\.guardian:Option:-SNAPSHOT/com.github.guardian:Option:e933c3a31d/g" \
            mobile/build.gradle
            
          sed -i \
            "s/de\.timroes:aXMLRPC:1\.8\.1/fr.turri:aXMLRPC:1.8.3/g" \
            base/build.gradle

          sed -i \
            "s/com\.nimbusds:srp6a-android:2\.0\.2/com.nimbusds:srp6a:2.1.0/g" \
            connectsdk/build.gradle
            
      - name: Create temporary signing keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore /tmp/popcorn-dummy.jks \
            -storepass dummy123 \
            -keypass dummy123 \
            -alias dummy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Popcorn Time Debug, OU=Build, O=Local, L=Brussels, C=BE"

      - name: Build ARM debug APK
        working-directory: source
        env:
          BUILD_NUMBER: '3'
          S_ALIAS: dummy
          S_KEYPASS: dummy123
          S_KEYSTORE: /tmp/popcorn-dummy.jks
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon :mobile:assembleArmDebug --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Show generated APK files
        if: always()
        shell: bash
        run: |
          find source -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-time-android-arm-apk
          path: source/mobile/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
